<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';"
  />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>指令记录器</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="指令记录器">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 36 36" fill="none">
            <rect x="1" y="1" width="34" height="34" rx="10" fill="url(#brandGradient)" />
            <rect x="1.5" y="1.5" width="33" height="33" rx="9.5" stroke="rgba(255,255,255,.14)" />
            <path d="M10 12.5L15.5 18L10 23.5" stroke="#07130f" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M18.5 23.5H26" stroke="#07130f" stroke-width="2.4" stroke-linecap="round" />
            <defs>
              <linearGradient id="brandGradient" x1="4" y1="3" x2="32" y2="34" gradientUnits="userSpaceOnUse">
                <stop stop-color="#7BF1D3" />
                <stop offset="1" stop-color="#35C7A2" />
              </linearGradient>
            </defs>
          </svg>
        </div>
        <div class="brand-copy">
          <h1>指令记录器</h1>
          <span>COMMAND NOTES</span>
        </div>
      </div>

      <div class="search-box" role="search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5" />
          <path d="M16 16l4 4" />
        </svg>
        <input
          id="searchInput"
          type="search"
          placeholder="搜索指令、翻译、用途或环境…"
          autocomplete="off"
          spellcheck="false"
          aria-label="搜索指令"
        />
        <kbd class="search-kbd">/</kbd>
        <button id="clearSearch" class="search-clear" type="button" title="清除搜索" aria-label="清除搜索" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M7 7l10 10M17 7L7 17" />
          </svg>
        </button>
      </div>

      <button id="addButton" class="add-button" type="button" title="新建指令 (Ctrl+N)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
        <span>新建指令</span>
        <kbd>Ctrl N</kbd>
      </button>
    </header>

    <div class="layout">
      <aside class="sidebar" aria-label="指令筛选">
        <nav class="sidebar-nav">
          <p class="side-label">指令库</p>
          <button class="nav-item is-active" type="button" data-filter-type="all">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 5.5h14v13H5z" />
              <path d="M8 9h8M8 12.5h8M8 16h5" />
            </svg>
            <span class="nav-text">全部指令</span>
            <span class="nav-count" id="countAll">0</span>
          </button>
          <button class="nav-item" type="button" data-filter-type="favorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.8l2.5 5.1 5.6.8-4 3.9.9 5.6-5-2.6-5 2.6.9-5.6-4-3.9 5.6-.8z" />
            </svg>
            <span class="nav-text">收藏</span>
            <span class="nav-count" id="countFavorites">0</span>
          </button>

          <p class="side-label side-label-env">软件环境</p>
          <div id="environmentList" class="environment-list"></div>
        </nav>

        <div class="sidebar-foot">
          <button id="openDataFolder" class="data-folder-button" type="button" title="打开本地数据目录">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z" />
            </svg>
            <span>数据目录</span>
          </button>
          <p>数据仅保存在本机</p>
        </div>
      </aside>

      <main class="main" id="mainContent">
        <div class="content-header">
          <div class="content-heading">
            <h2 id="listTitle">全部指令</h2>
            <p id="listSubtitle">点击任意指令即可复制</p>
          </div>
          <div class="content-tools">
            <div class="file-actions" aria-label="指令备份">
              <button id="importButton" class="tool-button" type="button" title="导入指令备份" aria-label="导入指令备份">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 3.5v11M7.5 10l4.5 4.5 4.5-4.5" />
                  <path d="M5 17.5v2h14v-2" />
                </svg>
                <span>导入</span>
              </button>
              <button id="exportButton" class="tool-button" type="button" title="导出指令备份" aria-label="导出指令备份">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 15V4M7.5 8.5L12 4l4.5 4.5" />
                  <path d="M5 17.5v2h14v-2" />
                </svg>
                <span>导出</span>
              </button>
            </div>
            <label class="sort-control" for="sortSelect">
              <span>排序</span>
              <span class="select-wrap">
                <select id="sortSelect">
                  <option value="manual">手动排序</option>
                  <option value="favorite">收藏优先</option>
                  <option value="newest">最近添加</option>
                  <option value="oldest">最早添加</option>
                  <option value="alpha">名称 A–Z</option>
                </select>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M7 10l5 5 5-5" />
                </svg>
              </span>
            </label>
          </div>
        </div>

        <div id="commandList" class="command-list" aria-live="polite">
          <div class="list-placeholder">
            <span class="spinner" aria-hidden="true"></span>
            <span>正在读取指令库…</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toastHost" class="toast-host" aria-live="polite" aria-atomic="false"></div>
  <div id="modalHost"></div>

  <script src="app.js"></script>
</body>
</html>
